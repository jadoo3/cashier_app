[tool.poetry]
name        = "cashier_app"
version     = "1.0.0"
description = "نظام نقاط البيع"
authors     = ["Your Name <you@example.com>"]
license     = "MIT"
readme      = "README.md"

[tool.poetry.dependencies]
python          = ">=3.9,<4.0"
SQLAlchemy      = "^2.0.25"
pandas          = "^2.2"
openpyxl        = "^3.1"
reportlab       = "^4.0.8"
python-dateutil = "^2.9"
pytz            = "^2025.2"
python-dotenv   = "^1.0.0"
arabic-reshaper = "^3.0.0"
python-bidi     = "^0.4.2"

# ──────────────
# ملاحظة: إذا احتجت لاحقًا لواجهة GUI،
# أضف PyQt5 يدويًا بالأوامر التالية (لا تدرجها هنا الآن):
#
#   poetry add PyQt5==5.15.10 pyqt5-qt5==5.15.2 pyqt5-sip==12.13.0
#
# أو أضفها كاعتمادية اختيارية:
#
# PyQt5      = { version = "^5.15.10", optional = true }
# pyqt5-qt5  = { version = "^5.15.2",  optional = true }
# pyqt5-sip  = { version = "^12.13.0", optional = true }
# ──────────────
pyqt5 = "5.15.10"
pyqt5-qt5 = "5.15.2"
pyqt5-sip = "12.13.0"
pyqt6 = "6.6.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4"
ruff   = "^0.4"
mypy   = "^1.10"

[build-system]
requires      = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
