<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For My Love</title>
  <style>
    :root {
      --bg-a: #120818;
      --bg-b: #3a1025;
      --bg-c: #ff8fab;
      --glass: rgba(255, 255, 255, 0.14);
      --text: #fff8fb;
      --accent: #ff4d88;
      --accent-2: #ff9ec2;
      --stem: #34b875;
      --leaf: #62dba0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Cairo", "Tajawal", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 15%, #ffffff22, transparent 30%),
        radial-gradient(circle at 82% 78%, #ffffff22, transparent 34%),
        linear-gradient(130deg, var(--bg-a), var(--bg-b) 52%, var(--bg-c));
      overflow: hidden;
    }

    .glow {
      position: fixed;
      width: 42vmax;
      height: 42vmax;
      border-radius: 50%;
      filter: blur(58px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.45;
      animation: pulse 6s ease-in-out infinite;
    }

    .g1 { background: #ff4d8850; top: -14vmax; left: -8vmax; }
    .g2 { background: #ffc2d868; bottom: -18vmax; right: -10vmax; animation-delay: 2s; }

    .card {
      position: relative;
      z-index: 2;
      width: min(92vw, 560px);
      padding: 2rem 1.2rem 2.2rem;
      text-align: center;
      border-radius: 28px;
      background: var(--glass);
      border: 1px solid #ffffff40;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 45px #0b040b80;
      animation: reveal 1.1s cubic-bezier(.21,.95,.33,1) both;
    }

    .title {
      margin: 0;
      font-size: clamp(1.5rem, 3.4vw, 2.3rem);
      font-weight: 700;
      letter-spacing: .2px;
    }

    .name {
      display: inline-block;
      color: #ffd3e5;
      text-shadow: 0 0 18px #ff70aa80;
      margin-right: 0.2rem;
    }

    .msg {
      margin: .75rem auto 0;
      width: fit-content;
      max-width: 90%;
      white-space: nowrap;
      overflow: hidden;
      border-left: 2px solid #ffe8f2;
      font-size: clamp(.95rem, 2.5vw, 1.1rem);
      opacity: .95;
      animation: typing 3.4s steps(34) 1.2s both, caret 700ms step-end infinite;
    }

    .rose-wrap {
      margin: 1.6rem auto .9rem;
      width: 240px;
      height: 240px;
      position: relative;
      animation: float 3.2s ease-in-out infinite;
    }

    .petal {
      --r: 0deg;
      position: absolute;
      width: 96px;
      height: 96px;
      top: 55px;
      left: 72px;
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      border-radius: 25% 75% 55% 45%;
      transform: rotate(var(--r)) scale(0.15);
      transform-origin: 50% 78%;
      box-shadow: inset -9px -10px 14px #9d0f4f4f, 0 0 15px #ff8db060;
      opacity: 0;
      animation: bloom 1.35s ease-out forwards;
    }

    .p2 { --r: 45deg; animation-delay: .06s; }
    .p3 { --r: 90deg; animation-delay: .12s; }
    .p4 { --r: 135deg; animation-delay: .18s; }
    .p5 { --r: 180deg; animation-delay: .24s; }
    .p6 { --r: 225deg; animation-delay: .3s; }
    .p7 { --r: 270deg; animation-delay: .36s; }
    .p8 { --r: 315deg; animation-delay: .42s; }

    .core {
      position: absolute;
      width: 66px;
      height: 66px;
      top: 89px;
      left: 87px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffb4cf, #f11169 58%, #b80f4e);
      box-shadow: inset -10px -12px 12px #7b00324d, 0 0 26px #ff74ad8a;
      transform: scale(0.2);
      opacity: 0;
      animation: bloom 1s .46s ease-out forwards;
    }

    .stem {
      position: absolute;
      width: 11px;
      height: 92px;
      top: 152px;
      left: 114px;
      background: linear-gradient(var(--stem), #218d59);
      border-radius: 999px;
    }

    .leaf {
      position: absolute;
      width: 58px;
      height: 28px;
      background: linear-gradient(145deg, var(--leaf), #2ea56b);
      border-radius: 0 100% 0 100%;
      box-shadow: inset -5px -6px 10px #126f432b;
    }

    .l1 { left: 64px; top: 188px; transform: rotate(-20deg); }
    .l2 { left: 118px; top: 204px; transform: rotate(158deg); }

    .hint {
      margin: 0;
      font-size: .95rem;
      opacity: .9;
    }

    .hearts span {
      position: absolute;
      bottom: -30px;
      color: #ffe2ee;
      text-shadow: 0 0 10px #ff8ab3b0;
      opacity: 0;
      animation: fly 5.2s linear infinite;
      z-index: 1;
      pointer-events: none;
    }

    .hearts span:nth-child(1) { left: 8%; font-size: 20px; animation-delay: 0s; }
    .hearts span:nth-child(2) { left: 18%; font-size: 14px; animation-delay: 1s; }
    .hearts span:nth-child(3) { left: 74%; font-size: 18px; animation-delay: 1.8s; }
    .hearts span:nth-child(4) { left: 87%; font-size: 13px; animation-delay: 2.6s; }
    .hearts span:nth-child(5) { left: 50%; font-size: 16px; animation-delay: 3.2s; }

    @keyframes reveal {
      from { transform: translateY(24px) scale(.96); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 34ch; }
    }

    @keyframes caret {
      50% { border-color: transparent; }
    }

    @keyframes bloom {
      to { transform: rotate(var(--r)) scale(1); opacity: 1; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    @keyframes fly {
      0% { transform: translateY(20px) scale(.7); opacity: 0; }
      12% { opacity: .95; }
      100% { transform: translateY(-110vh) scale(1.3); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="glow g1" aria-hidden="true"></div>
  <div class="glow g2" aria-hidden="true"></div>

  <div class="hearts" aria-hidden="true">
    <span>❤</span><span>❤</span><span>❤</span><span>❤</span><span>❤</span>
  </div>

  <main class="card">
    <h1 class="title">وردة إلكترونية خصيصًا إلك يا <span class="name" id="name">حبيبتي</span></h1>
    <p class="msg" id="msg">كل ما تفتحي الرابط... قلبي بيسلّم عليكي قبلّي 🌹</p>

    <div class="rose-wrap" aria-label="وردة إلكترونية متحركة">
      <div class="petal"></div>
      <div class="petal p2"></div>
      <div class="petal p3"></div>
      <div class="petal p4"></div>
      <div class="petal p5"></div>
      <div class="petal p6"></div>
      <div class="petal p7"></div>
      <div class="petal p8"></div>
      <div class="core"></div>
      <div class="stem"></div>
      <div class="leaf l1"></div>
      <div class="leaf l2"></div>
    </div>

    <p class="hint">من مبرمج واقع بحبك 💗</p>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const rawName = (params.get("name") || "").trim();
    const rawMsg = (params.get("msg") || "").trim();

    const safeName = rawName.slice(0, 40) || "حبيبتي";
    const safeMsg = rawMsg.slice(0, 120) || "كل ما تفتحي الرابط... قلبي بيسلّم عليكي قبلّي 🌹";

    document.getElementById("name").textContent = safeName;

    const msgEl = document.getElementById("msg");
    msgEl.textContent = safeMsg;
    msgEl.style.width = "0";
    msgEl.style.animation = "none";
    void msgEl.offsetWidth;
    const steps = Math.max(20, Math.min(60, safeMsg.length));
    msgEl.style.animation = `typing 3.2s steps(${steps}) 1.1s both, caret 700ms step-end infinite`;
  </script>
</body>
</html>
