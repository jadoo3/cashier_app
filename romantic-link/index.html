<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rose Night</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #05040b;
      --bg-2: #0f0b1f;
      --bg-3: #1e0f2d;
      --gold: #f7e7b2;
      --name-a: #ffd7ea;
      --name-b: #f7b7ff;
      --name-c: #b8d7ff;
      --rose-1: #8f123f;
      --rose-2: #cf2f6e;
      --rose-3: #ff79a7;
      --stem: #2d8f67;
      --leaf: #46b884;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--bg-1);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #fff;
      background-color: var(--bg-1);
      background:
        radial-gradient(circle at 20% 18%, #ffffff12, transparent 32%),
        radial-gradient(circle at 80% 74%, #ffffff12, transparent 34%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2) 45%, var(--bg-3));
    }

    .stars,
    .stars::before,
    .stars::after {
      position: fixed;
      inset: -20%;
      content: "";
      pointer-events: none;
      background-repeat: repeat;
      background-size: 280px 280px;
      animation: twinkle 5.8s ease-in-out infinite;
      opacity: .6;
    }

    .stars {
      background-image:
        radial-gradient(2px 2px at 30px 40px, #fff 98%, transparent),
        radial-gradient(1.6px 1.6px at 130px 90px, #fff8 98%, transparent),
        radial-gradient(1.8px 1.8px at 220px 210px, #fff9 98%, transparent),
        radial-gradient(1.2px 1.2px at 90px 190px, #fff7 98%, transparent),
        radial-gradient(1.4px 1.4px at 180px 35px, #fff6 98%, transparent);
    }

    .stars::before {
      transform: scale(1.2) rotate(6deg);
      animation-delay: 1.4s;
      opacity: .35;
    }

    .stars::after {
      transform: scale(0.95) rotate(-4deg);
      animation-delay: 2.6s;
      opacity: .28;
    }

    .scene {
      position: relative;
      width: min(95vw, 760px);
      height: min(92vh, 900px);
      display: grid;
      place-items: center;
      z-index: 2;
    }

    .single-rose {
      --rose-scale: 1;
      position: absolute;
      left: 50%;
      bottom: max(34px, 6vh);
      width: 280px;
      height: 410px;
      transform: translateX(-50%) scale(var(--rose-scale));
      filter: drop-shadow(0 26px 34px #000000a8);
      animation: rose-breath 5.8s ease-in-out infinite;
    }

    .rose-head {
      position: absolute;
      top: 0;
      left: 50%;
      width: 230px;
      height: 230px;
      transform: translateX(-50%);
      animation: bloom-head 1.6s cubic-bezier(.2,.9,.22,1) both;
    }

    .stem {
      position: absolute;
      left: 50%;
      top: 205px;
      width: 13px;
      height: 200px;
      border-radius: 999px;
      background: linear-gradient(var(--stem), #205f45);
      transform: translateX(-50%) rotate(2deg);
      box-shadow: inset -3px 0 7px #0e4b33;
    }

    .leaf {
      position: absolute;
      width: 82px;
      height: 42px;
      background: linear-gradient(135deg, var(--leaf), #2b9367);
      border-radius: 0 100% 0 100%;
      box-shadow: inset -6px -8px 12px #0a4b2f44;
    }

    .leaf.l1 { left: 54px; top: 282px; transform: rotate(-28deg); }
    .leaf.l2 { right: 50px; top: 322px; transform: rotate(148deg); }

    .petal {
      --r: 0deg;
      --tx: 0px;
      --ty: 0px;
      --sx: 1;
      --sy: 1;
      position: absolute;
      left: 74px;
      top: 72px;
      width: 82px;
      height: 112px;
      border-radius: 58% 58% 45% 45% / 72% 72% 36% 36%;
      background:
        radial-gradient(circle at 36% 24%, #ffd1e0 0 8%, transparent 24%),
        linear-gradient(155deg, #ff8bb3 0%, var(--rose-3) 34%, var(--rose-2) 68%, var(--rose-1) 100%);
      box-shadow: inset -10px -16px 18px #5f0f2f70, inset 9px 9px 16px #ffd8e440, 0 0 20px #ff6da860;
      transform: translate(var(--tx), var(--ty)) rotate(var(--r)) scale(.08);
      transform-origin: 50% 88%;
      opacity: 0;
      animation: bloom 1.8s cubic-bezier(.2,.9,.22,1) forwards;
    }

    .p1 { --r: -92deg; --tx: -58px; --ty: 12px; --sx: 1.15; --sy: .96; animation-delay: .05s; }
    .p2 { --r: -62deg; --tx: -44px; --ty: -24px; --sx: 1.12; --sy: 1.02; animation-delay: .1s; }
    .p3 { --r: -30deg; --tx: -20px; --ty: -48px; --sx: 1.04; --sy: 1.08; animation-delay: .15s; }
    .p4 { --r: 0deg; --tx: 0px; --ty: -58px; --sx: 1.08; --sy: 1.1; animation-delay: .2s; }
    .p5 { --r: 30deg; --tx: 20px; --ty: -48px; --sx: 1.04; --sy: 1.08; animation-delay: .25s; }
    .p6 { --r: 62deg; --tx: 44px; --ty: -24px; --sx: 1.12; --sy: 1.02; animation-delay: .3s; }
    .p7 { --r: 92deg; --tx: 58px; --ty: 12px; --sx: 1.15; --sy: .96; animation-delay: .35s; }
    .p8 { --r: -120deg; --tx: -70px; --ty: 50px; --sx: 1.18; --sy: .86; animation-delay: .4s; }
    .p9 { --r: 120deg; --tx: 70px; --ty: 50px; --sx: 1.18; --sy: .86; animation-delay: .45s; }
    .p10 { --r: -45deg; --tx: -30px; --ty: 22px; --sx: .78; --sy: .86; animation-delay: .5s; }
    .p11 { --r: 45deg; --tx: 30px; --ty: 22px; --sx: .78; --sy: .86; animation-delay: .55s; }
    .p12 { --r: 0deg; --tx: 0px; --ty: 18px; --sx: .7; --sy: .82; animation-delay: .6s; }

    .core {
      position: absolute;
      left: 86px;
      top: 88px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 28%, #ffd5e3 0 8%, transparent 22%),
        radial-gradient(circle, #ff5f99 0 34%, #cc1d60 58%, #781033 100%);
      box-shadow: inset -10px -12px 12px #5f0a2e66, 0 0 24px #ff86af88;
      transform: scale(0.08);
      opacity: 0;
      animation: bloom-core 1.45s .45s cubic-bezier(.2,.9,.22,1) forwards;
    }

    .text-wrap {
      position: absolute;
      top: 13%;
      width: min(92vw, 700px);
      text-align: center;
      padding: 0 12px;
    }

    .name {
      margin: 0;
      font-family: "Cairo", sans-serif;
      font-size: clamp(2rem, 8vw, 4.9rem);
      font-weight: 800;
      line-height: 1.15;
      background: linear-gradient(120deg, var(--name-a), var(--name-b), var(--name-c));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 8px 26px #ff8fc266;
      transform: translateY(34px);
      opacity: 0;
      animation: rise-name 1.2s .25s ease-out forwards;
    }

    .verse {
      margin: 14px auto 0;
      max-width: 22ch;
      font-family: "Amiri", serif;
      font-size: clamp(1.05rem, 3.9vw, 2rem);
      font-weight: 700;
      line-height: 1.85;
      color: #fff2c8;
      text-shadow: 0 0 12px #f7e7b266, 0 2px 18px #000000d0;
      opacity: 0;
      animation: fade-verse 2.2s 1.25s ease-out forwards;
    }

    @keyframes twinkle {
      0%, 100% { opacity: .28; }
      50% { opacity: .72; }
    }

    @keyframes bloom {
      to { transform: translate(var(--tx), var(--ty)) rotate(var(--r)) scale(var(--sx), var(--sy)); opacity: 1; }
    }

    @keyframes bloom-core {
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes rose-breath {
      0%, 100% { transform: translateX(-50%) scale(var(--rose-scale)) rotate(0deg) translateY(0); }
      50% { transform: translateX(-50%) scale(var(--rose-scale)) rotate(1.1deg) translateY(-5px); }
    }

    @keyframes bloom-head {
      from { transform: translateX(-50%) translateY(18px) scale(.9); opacity: .4; }
      to { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
    }

    @keyframes rise-name {
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes fade-verse {
      to { opacity: 1; }
    }

    @media (max-width: 640px) {
      .scene { height: 100vh; }
      .text-wrap { top: 11%; }
      .single-rose {
        --rose-scale: .9;
        bottom: max(32px, 5vh);
        width: 250px;
        height: 370px;
      }
      .verse { max-width: 20ch; }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <main class="scene">
    <section class="text-wrap">
      <h1 class="name" id="name"></h1>
      <p class="verse">فَوَدَدتُ تَقبيلَ السُيوفِ لِأَنَّها ... لَمَعَت كَبِرقِ ثَغرِكِ المُتَبَسِّمِ</p>
    </section>

    <section class="single-rose" aria-hidden="true">
      <div class="rose-head">
        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>
        <div class="petal p6"></div>
        <div class="petal p7"></div>
        <div class="petal p8"></div>
        <div class="petal p9"></div>
        <div class="petal p10"></div>
        <div class="petal p11"></div>
        <div class="petal p12"></div>
        <div class="core"></div>
      </div>
      <div class="stem"></div>
      <div class="leaf l1"></div>
      <div class="leaf l2"></div>
    </section>
  </main>

  <script>
    document.getElementById("name").textContent = "شادن";
  </script>
</body>
</html>
